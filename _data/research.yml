- title: "可信自主决策与强化学习"
  description: "围绕复杂动态环境下的自主决策与控制开展研究，重点关注模型不确定性、仿真偏差、安全约束、跨场景泛化与在线自适应等问题。熟悉深度强化学习、元强化学习、安全强化学习、鲁棒强化学习、图强化学习等方法，具备知识驱动与数据驱动相结合的混合智能决策架构设计能力。"

- title: "多智能体协同与对抗决策"
  description: "面向异构智能体、动态任务及复杂对抗环境，研究多智能体协同感知、任务分配与联合决策方法。熟悉多智能体强化学习与集中训练分散执行（CTDE）框架，掌握基于 Transformer、注意力机制及自回归策略的协同决策方法，并关注自博弈、课程学习及生成式策略在复杂对抗决策中的应用。"

- title: "序贯决策建模与智能控制"
  description: "具备复杂动态系统的序贯决策建模与算法定制能力，可依据任务机理开展状态/观测表征、动作空间编码、奖励塑形、探索机制、安全约束及策略更新设计。已在雷达干扰、制导控制、电力调度与储能决策等场景开展研究与验证，并进一步面向低空安全与反无人机等复杂动态任务开展自主决策方法研究。"

- title: "优化规划与任务调度"
  description: "研究复杂约束条件下的资源配置、动态任务分配与多目标决策问题。熟悉遗传算法、粒子群优化、差分进化、贝叶斯优化等智能优化方法，掌握混合整数线性规划、匈牙利算法及随机/鲁棒优化基本方法，具备将强化学习、进化计算与数学规划相结合开展异构资源调度和多目标优化的能力。"

- title: "动态系统预测与预测—决策融合"
  description: "关注动态环境中的状态演化与预测信息利用，熟悉 LSTM、Transformer 等时序建模方法以及滚动时域优化机制，具备将目标运动、轨迹及系统状态预测信息融入强化学习与优化控制的能力，为动态任务规划、自主决策与协同控制提供预测支撑。"
